# HG Microgrid EMS — VM 架站
#
# 使用方式（於專案根目錄）：
#   1. cp backend/.env.example backend/.env   # 填入 PG_* 密碼與主機
#   2. docker compose up -d --build
#   3. 瀏覽 http://<VM-IP>/
#
# 架構：
#   web (nginx:80)  → 靜態 Vue + 反向代理 /api、/time
#   api (node:5000) → 讀取外部 PostgreSQL（不在 compose 內起 DB）

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hg-ems-api
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
    # 僅同網路內給 web 用；若要直接測 API 可取消註解
    # ports:
    #   - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: hg-ems-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
